<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTable — Restaurant Discovery, by Algolia</title>
    <meta
      name="description"
      content="Find and book a table with instant, relevant search."
    />
    <link rel="icon" href="/assets/favicon.ico" type="image/png" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="modern-app">
      <header class="app-header">
        <div class="app-header__brand">
          <span class="brand-badge">
            <img src="/assets/opentable-icon.png" alt="" class="brand-badge__logo" />
          </span>
          <div>
            <h1 class="app-header__title">OpenTable</h1>
            <p class="app-header__tagline">
              Restaurant discovery, powered by Algolia
            </p>
          </div>
        </div>
        <button id="retro-toggle" class="retro-toggle" type="button">
          🕹️ <span>Way Back When Machine</span>
        </button>
      </header>

      <div class="search-section">
        <h2 class="search-section__title">Search</h2>
        <div id="searchbox" class="searchbox"></div>
      </div>

      <div class="filter-bar">
        <div class="filter-pill" data-filter="cuisine">
          <button class="filter-pill__trigger" type="button">
            Cuisine <span class="filter-pill__chevron">⌄</span>
          </button>
          <div class="filter-pill__panel" id="cuisine-list"></div>
        </div>
        <div class="filter-pill" data-filter="price">
          <button class="filter-pill__trigger" type="button">
            Price <span class="filter-pill__chevron">⌄</span>
          </button>
          <div class="filter-pill__panel" id="price-list"></div>
        </div>
        <div class="filter-pill" data-filter="dining-style">
          <button class="filter-pill__trigger" type="button">
            Dining style <span class="filter-pill__chevron">⌄</span>
          </button>
          <div class="filter-pill__panel" id="dining-style-list"></div>
        </div>
        <button id="geo-toggle" class="geo-toggle" type="button">
          📍 Near me
        </button>
        <div id="clear-refinements" class="clear-refinements"></div>
        <div id="stats" class="stats"></div>
      </div>

      <main class="results">
        <div id="hits" class="hits"></div>
        <div id="pagination" class="pagination"></div>
      </main>
    </div>

    <div class="app app--retro" id="retro-app" hidden>
      <header class="retro-header">
        <p class="retro-header__marquee">
          ☆ ─── WELCOME TO THE WAY BACK WHEN MACHINE ─── ☆
        </p>
        <h1 class="retro-header__title">📼 2014.exe 📼</h1>
        <p class="retro-header__tagline">
          The year our search box launched... looking a lot like this one.
        </p>
        <button id="modern-toggle" class="modern-toggle" type="button">
          ↩ back to 2026
        </button>
      </header>

      <div id="retro-searchbox" class="retro-searchbox"></div>

      <div id="retro-category-list" class="retro-category-list"></div>

      <div id="retro-stats" class="retro-stats"></div>

      <div id="retro-hits" class="retro-hits"></div>
      <div id="retro-pagination" class="retro-pagination"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
